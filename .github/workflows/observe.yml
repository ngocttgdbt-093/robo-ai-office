name: Observe ROBO AI OFFICE GitHub activity

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Collect read-only activity snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/observe_github.py
      - name: Upload snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robo-github-activity
          path: artifacts/github-activity.json
          if-no-files-found: warn
          retention-days: 7
