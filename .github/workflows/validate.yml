name: Validate agent foundation

on:
  push:
    branches:
      - 'setup/**'
      - 'feat/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify required files and safety rules
        shell: bash
        run: |
          set -euo pipefail
          test -s AGENTS.md
          test -s docs/rollout.md
          grep -q 'RED → GREEN → REFACTOR' AGENTS.md
          grep -q 'Never merge' AGENTS.md
          grep -q 'obra/superpowers' AGENTS.md
          echo "Foundation validation passed"
      - name: Run Node.js tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -d tests ]; then
            node --test
          else
            echo "No tests directory yet; skipping Node tests"
          fi
